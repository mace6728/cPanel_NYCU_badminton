; Session-cookie defaults for every PHP script under public_html (read by
; PHP-FPM / FastCGI on cPanel; harmless if the host ignores it).
; The site is HTTPS-only (see .htaccess), so Secure cannot lock anyone out.
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_lifetime = 0
expose_php = Off
