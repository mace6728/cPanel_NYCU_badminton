</div>
<script async src="tinymce/js/tinymce/tinymce.min.js"></script>
<script src="js/jquery.js"></script>
<script>
    function postDisplay(){
        document.getElementById("check").style.display = "none";
        document.getElementById("post").style.display = "block";
        document.getElementById("drawer").className = "mdl-layout__drawer  mdl-color--white";
    }
    function checkDisplay(){
        document.getElementById("check").style.display = "block";
        document.getElementById("post").style.display = "none";
        document.getElementById("drawer").className = "mdl-layout__drawer  mdl-color--white";
    }
    function newArticle(){
        var heading = document.getElementById("heading").value;
        var allParagraph = tinyMCE.activeEditor.getContent().toString();
        var radioInput = document.getElementsByTagName("INPUT");
        var category = "";
        var i;
        for(i = 0;i<radioInput.length;i++){
          if(radioInput[i].checked){
            category = categoryDecider(i);
          }
        }
        $.post("articleToDB.php",
        {
          'category': category,
          'heading' : heading,
          'content' : allParagraph
        }, function(data, status){
            if(data=="success"){
              document.getElementById("successArticle").style.display="block";
              setTimeout("document.getElementById(\"successArticle\").style.display=\"none\"",3000);
            }else{
              document.getElementById("failArticle").style.display="block";
              setTimeout("document.getElementById(\"failArticle\").style.display=\"none\"",3000);
            }
          }
        );
    }
    function categoryDecider(numbering){
      switch(numbering){
        case 0:
          return "最新消息";
        case 1:
          return "比賽成果";
        case 2:
          return "競賽資訊";
      }
    }

</script>
</body>
